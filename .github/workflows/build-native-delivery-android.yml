name: Build Samruddhi Native Android Delivery App

on:
  push:
    paths:
      - "android-location/**"
      - ".github/workflows/build-native-delivery-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-location
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samruddhi-delivery-android-debug
          path: android-location/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
