<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="cache-control" content="no-cache">
<title>Opening Samruddhi Gas Location Form</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:28px;background:#f4f7f6;color:#18332b}
main{max-width:460px;margin:10vh auto;background:#fff;border:1px solid #dce8e3;border-radius:16px;padding:22px;box-shadow:0 8px 30px #1232}
p{line-height:1.5;color:#52645d}a{color:#08765c;font-weight:700}
</style>
</head>
<body>
<main>
<h2>Opening secure location form…</h2>
<p>Please wait while we open the current Samruddhi Gas location map. Your secure one-time link will be preserved.</p>
<noscript><p>Enable JavaScript to continue, or request a fresh location link from Samruddhi Gas Agency.</p><a href="../">Open location page</a></noscript>
</main>
<script>
(function(){
  const target=new URL('../',window.location.href);
  target.search=window.location.search;
  target.hash=window.location.hash;
  window.location.replace(target.href);
})();
</script>
</body>
</html>
